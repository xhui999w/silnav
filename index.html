<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的导航</title>
<style>
  :root{
    --bg:#f3f4f6; --card:#ffffff; --text:#1f2937; --muted:#6b7280;
    --border:#e5e7eb; --accent:#3b82f6; --accent-bg:#eff6ff; --green:#10b981;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--text); min-height:100vh; padding:20px 16px;}
  .wrap{max-width:960px;margin:0 auto;}
  header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:26px;flex-wrap:wrap;}
  .brand{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:500;}
  .logo{width:30px;height:30px;border-radius:8px;background:var(--accent-bg);color:var(--accent);
    display:flex;align-items:center;justify-content:center;font-weight:500;font-size:14px;}
  .search-wrap{flex:1;min-width:260px;max-width:520px;position:relative;display:flex;align-items:center;}
  .search-wrap input{width:100%;padding:9px 12px;padding-right:74px;font-size:14px;border:1px solid var(--border);
    border-radius:999px;background:var(--card);outline:none;color:var(--text);}
  .search-wrap input:focus{border-color:var(--accent);}
  .search-btn{position:absolute;right:4px;top:50%;transform:translateY(-50%);padding:5px 12px;
    font-size:12px;border:none;border-radius:999px;background:var(--accent);color:#fff;cursor:pointer;}
  .search-btn:hover{opacity:.9;}
  .category{margin-bottom:18px;}
  .cat-header{display:flex;align-items:center;gap:8px;margin-bottom:10px;cursor:pointer;user-select:none;}
  .cat-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);}
  .cat-name{font-size:14px;font-weight:500;}
  .cat-count{font-size:11px;color:var(--muted);background:var(--border);padding:1px 7px;border-radius:999px;}
  .cat-arrow{margin-left:auto;font-size:12px;color:var(--muted);transition:transform .15s;}
  .cat-arrow.collapsed{transform:rotate(-90deg);}
  .chips{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start;}
  .chips.collapsed{display:none;}
  .chip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;background:var(--card);
    border:1px solid var(--border);border-radius:8px;text-decoration:none;color:var(--text);font-size:13px;
    transition:border-color .15s,box-shadow .15s;}
  .chip:hover{border-color:var(--accent);}
  .chip img{width:16px;height:16px;border-radius:3px;object-fit:contain;}
  .txt-icon{width:16px;height:16px;display:flex;align-items:center;justify-content:center;font-size:11px;
    font-weight:500;color:var(--accent);background:var(--accent-bg);border-radius:3px;}
  /* NAS 卡片 */
  .nas-card{display:inline-flex;flex-direction:column;gap:6px;padding:8px 10px;background:var(--card);
    border:1px solid var(--border);border-radius:8px;min-width:160px;}
  .nas-card:hover{border-color:var(--accent);}
  .nas-name{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500;}
  .nas-name img{width:16px;height:16px;border-radius:3px;object-fit:contain;}
  .nas-links{display:flex;gap:6px;}
  .nas-btn{flex:1;text-align:center;padding:5px 8px;border-radius:6px;font-size:12px;
    text-decoration:none;color:#fff;white-space:nowrap;}
  .nas-btn.int{background:var(--green);}
  .nas-btn.ext{background:var(--accent);}
  .nas-btn:hover{opacity:.88;}
  .empty{color:var(--muted);font-size:13px;text-align:center;padding:30px 0;}
  .hint{text-align:center;color:var(--muted);font-size:12px;margin-top:30px;}
  @media (max-width:640px){
    header{justify-content:center;}
    .search-wrap{order:3;width:100%;max-width:none;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><div class="logo" id="logo">导</div><span id="title">我的导航</span></div>
    <div class="search-wrap">
      <input id="search" placeholder="搜索网址或回车搜索…" autocomplete="off" />
      <button class="search-btn" id="searchBtn">百度</button>
    </div>
  </header>
  <main id="main"></main>
  <div class="hint" id="hint"></div>
</div>
<script src="sites.js"></script>
<script>
(function(){
  var cfg = window.NAV_CONFIG || {title:"我的导航"};
  document.getElementById('title').textContent = cfg.title || "我的导航";
  if(cfg.logo) document.getElementById('logo').textContent = cfg.logo;

  var engines = cfg.searchEngines || [
    {name:"百度", url:"https://www.baidu.com/s?wd="},
    {name:"必应", url:"https://www.bing.com/search?q="},
    {name:"Google", url:"https://www.google.com/search?q="}
  ];
  var engineIndex = 0;
  var defaultEngine = cfg.searchEngine || "百度";
  engines.forEach(function(e,i){ if(e.name === defaultEngine) engineIndex = i; });
  var searchBtn = document.getElementById('searchBtn');
  function updateEngineBtn(){ searchBtn.textContent = engines[engineIndex].name; }
  updateEngineBtn();

  function faviconUrl(url){
    try {
      var u = new URL(url);
      return 'https://favicon.im/' + encodeURIComponent(u.hostname);
    } catch(e){ return ''; }
  }
  function collapsedKey(catName){ return 'nav_collapsed_' + catName; }

  // 普通链接 chip
  function createChip(link){
    var a = document.createElement('a');
    a.href = link.url; a.target = '_blank'; a.rel = 'noopener'; a.className = 'chip';
    a.title = (link.name || link.url) + ' — ' + link.url;
    var initial = (link.icon || link.name || '?').charAt(0);
    var txtIcon = document.createElement('span'); txtIcon.className = 'txt-icon'; txtIcon.textContent = initial;

    if (link.icon) {
      a.appendChild(txtIcon);
    } else if (cfg.useFavicon !== false) {
      var fav = faviconUrl(link.url);
      if (fav) {
        var img = document.createElement('img');
        img.src = fav; img.alt = '';
        img.onerror = function(){ img.style.display='none'; txtIcon.style.display='flex'; };
        txtIcon.style.display = 'none';
        a.appendChild(img);
        a.appendChild(txtIcon);
      } else {
        a.appendChild(txtIcon);
      }
    } else {
      a.appendChild(txtIcon);
    }
    var span = document.createElement('span'); span.textContent = link.name || link.url;
    a.appendChild(span);
    return a;
  }

  // NAS 卡片：内网 / 外网 双入口
  function createNasCard(link){
    var card = document.createElement('div'); card.className = 'nas-card';
    var name = document.createElement('div'); name.className = 'nas-name';

    var fav = faviconUrl(link.external || link.internal);
    if (fav) {
      var img = document.createElement('img'); img.src = fav; img.alt = '';
      name.appendChild(img);
    }
    var span = document.createElement('span'); span.textContent = link.name || 'NAS';
    name.appendChild(span);
    card.appendChild(name);

    var links = document.createElement('div'); links.className = 'nas-links';
    if (link.internal) {
      var bi = document.createElement('a');
      bi.href = link.internal; bi.target = '_blank'; bi.rel = 'noopener';
      bi.className = 'nas-btn int'; bi.textContent = '内网';
      bi.title = link.internal;
      links.appendChild(bi);
    }
    if (link.external) {
      var be = document.createElement('a');
      be.href = link.external; be.target = '_blank'; be.rel = 'noopener';
      be.className = 'nas-btn ext'; be.textContent = '外网';
      be.title = link.external;
      links.appendChild(be);
    }
    card.appendChild(links);
    return card;
  }

  function render(){
    var q = (document.getElementById('search').value || '').trim().toLowerCase();
    var main = document.getElementById('main');
    main.innerHTML = '';
    var categories = cfg.categories || [];
    var total = 0;

    categories.forEach(function(cat){
      var allLinks = cat.links || [];
      var links = allLinks.filter(function(it){
        if(!q) return true;
        var hay = ((it.name||'') + ' ' + (it.url||'') + ' ' + (it.internal||'') + ' ' + (it.external||'')).toLowerCase();
        return hay.indexOf(q) >= 0;
      });
      if(!links.length) return;

      var section = document.createElement('section'); section.className = 'category';
      var head = document.createElement('div'); head.className = 'cat-header';
      var dot = document.createElement('span'); dot.className = 'cat-dot';
      var name = document.createElement('span'); name.className = 'cat-name'; name.textContent = cat.name;
      var count = document.createElement('span'); count.className = 'cat-count'; count.textContent = links.length;
      var arrow = document.createElement('span'); arrow.className = 'cat-arrow'; arrow.textContent = '▼';
      head.appendChild(dot); head.appendChild(name); head.appendChild(count); head.appendChild(arrow);

      var chips = document.createElement('div'); chips.className = 'chips';
      links.forEach(function(link){
        chips.appendChild(cat.nas ? createNasCard(link) : createChip(link));
      });
      total += links.length;

      var isCollapsed = localStorage.getItem(collapsedKey(cat.name)) === '1';
      if(isCollapsed){ chips.classList.add('collapsed'); arrow.classList.add('collapsed'); }

      head.addEventListener('click', function(){
        var now = chips.classList.toggle('collapsed');
        arrow.classList.toggle('collapsed');
        localStorage.setItem(collapsedKey(cat.name), now ? '1' : '0');
      });

      section.appendChild(head); section.appendChild(chips);
      main.appendChild(section);
    });

    if(!total){
      main.innerHTML = '<div class="empty">没有匹配的网址</div>';
    }
    document.getElementById('hint').textContent = '顶部 NAS 分类每个设备带「内网 / 外网」两个入口，其余分类内外网同屏显示。';
  }

  document.getElementById('search').addEventListener('input', render);
  document.getElementById('search').addEventListener('keydown', function(e){
    if(e.key === 'Enter'){
      var q = this.value.trim();
      if(q) window.open(engines[engineIndex].url + encodeURIComponent(q), '_blank');
    }
  });
  document.getElementById('searchBtn').addEventListener('click', function(){
    engineIndex = (engineIndex + 1) % engines.length;
    updateEngineBtn();
    var q = document.getElementById('search').value.trim();
    if(q) window.open(engines[engineIndex].url + encodeURIComponent(q), '_blank');
  });

  render();
})();
</script>
</body>
</html>
